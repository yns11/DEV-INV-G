# =============================================================================
# Databricks Apps runtime manifest — Campagnes Inventaire
# -----------------------------------------------------------------------------
# This file drives the app when it is deployed from the Databricks UI or with
# `databricks apps deploy`. It MUST stay in sync with the `config:` block of
# ../databricks.yml (Asset Bundle deployments read that one instead).
#
# Port/host rules (the #1 cause of 502 Bad Gateway):
#   * bind to 0.0.0.0 — never localhost/127.0.0.1
#   * use DATABRICKS_APP_PORT — never a hard-coded port
# A single process serves both the JSON API and the pre-built React SPA, because
# only one service may bind to DATABRICKS_APP_PORT.
#
# `main.py` starts uvicorn itself and reads the port from the environment. The
# uvicorn options (single worker, 75 s keep-alive, no access log) live there, so
# both files stay short and cannot drift apart. Writing the command as
# `uvicorn ... --port ${DATABRICKS_APP_PORT}` would work here but breaks the
# identical block in databricks.yml, where `${...}` is bundle interpolation.
# =============================================================================

command:
  - python
  - main.py

env:
  # --- Resource bindings (resolved by the platform, never hard-code IDs) ------
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: INV_LLM_ENDPOINT
    valueFrom: serving-endpoint

  # --- Unity Catalog layout ---------------------------------------------------
  # The catalog already exists and cannot be created by this project; only the
  # schema and volume below are provisioned (see sql/00_unity_catalog.sql).
  - name: INV_UC_CATALOG
    value: "emotors_data_champions"
  - name: INV_UC_SCHEMA
    value: "inventory"
  - name: INV_UC_VOLUME
    value: "inventory_evidence"

  # --- Application behaviour --------------------------------------------------
  - name: INV_GENERIC_WAREHOUSE
    value: "B06VRAC"
  - name: INV_GENERIC_LOCATION
    value: "GENERIQUE"
  - name: INV_LOG_LEVEL
    value: "INFO"
  - name: INV_ENV
    value: "prod"

  # Chemin de ressource de la branche Lakebase. La plateforme n'injecte pas le
  # chemin de l'endpoint, indispensable pour obtenir un credential ; l'app le
  # retrouve en listant les endpoints de cette branche et en comparant PGHOST.
  # Adaptez le nom du projet si le vôtre ne s'appelle pas « inventaire ».
  - name: INV_LAKEBASE_BRANCH
    value: "projects/inventaire/branches/production"

  # Lakebase connection variables (PGHOST / PGDATABASE / PGUSER / PGPORT /
  # PGSSLMODE / PGAPPNAME) are injected automatically once the `postgres`
  # resource is attached to the app. Do not declare them here. The endpoint's
  # resource path is NOT among them, hence INV_LAKEBASE_BRANCH above.
