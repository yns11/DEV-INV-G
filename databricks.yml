# =============================================================================
# Databricks Asset Bundle — Campagnes Inventaire
# -----------------------------------------------------------------------------
# Deploy with:
#   databricks bundle validate -t dev
#   databricks apps deploy -t dev --profile <PROFILE>
#
# `databricks apps deploy` validates, uploads, applies `config:` AND starts the
# app. A bare `databricks bundle deploy` uploads the code but leaves the app
# stopped with no URL — see docs/03-deployment-guide.md.
# =============================================================================

bundle:
  name: campagnes-inventaire

# The bundle's file synchronisation honours .gitignore, and `app/static/` is
# listed there — it is build output, not source. Without this override the SPA
# is silently left out of every deployment: the app starts, the API answers,
# and the browser gets no interface. `sync.include` re-admits the directory for
# upload while keeping it out of Git.
sync:
  include:
    - app/static/**

variables:
  warehouse_id:
    description: SQL warehouse used for all Delta / Unity Catalog reads.
  llm_endpoint:
    description: Serving endpoint (vision-capable LLM) used to read scanned counting sheets.
    default: databricks-claude-opus-5
  # --- Lakebase (Postgres Autoscaling) --------------------------------------
  # The app resource is addressed by *resource paths*, not by display names:
  #   branch   = projects/<project>/branches/<branch>
  #   database = projects/<project>/branches/<branch>/databases/<database>
  # Every id is RFC 1123 (lowercase letters, digits, hyphens — no underscore),
  # which is why the database id is `databricks-postgres` while the Postgres
  # database it points at is `databricks_postgres`. Read the exact ids with:
  #   databricks postgres list-projects  --profile <PROFILE>
  #   databricks postgres list-branches  projects/<project> --profile <PROFILE>
  #   databricks postgres list-databases projects/<project>/branches/<branch> ...
  lakebase_project:
    description: >-
      Lakebase project id — the second element of the console breadcrumb
      (Projects › <projet> › <branche>). Confirm with `databricks postgres
      list-projects`.
    default: inventaire
  lakebase_branch:
    description: >-
      Lakebase branch id — the third element of the breadcrumb. A new project
      auto-provisions it as `production`.
    default: production
  lakebase_database:
    description: >-
      Lakebase database *id* (last segment of the `name` returned by
      `list-databases`). The auto-provisioned database is `databricks-postgres`;
      its Postgres name (`databricks_postgres`) is injected at runtime as
      PGDATABASE and never needs to be declared here.
    default: databricks-postgres
  uc_catalog:
    description: Existing Unity Catalog catalog (cannot be created by this project).
    default: emotors_data_champions
  uc_schema:
    description: Schema created by sql/00_unity_catalog.sql.
    default: inventory
  uc_volume:
    description: UC volume holding scans, imports and generated reports.
    default: inventory_evidence

resources:
  apps:
    campagnes_inventaire:
      name: campagnes-inventaire
      description: >-
        Pilotage de bout en bout des campagnes d'inventaire physique
        (préparation, comptage, analyse & ajustements, clôture).
      source_code_path: ./app

      # --- Resources: the platform auto-grants these permissions to the app SP -
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.llm_endpoint}
            permission: CAN_QUERY
        # Lakebase Autoscaling uses the `postgres` key. The legacy `database`
        # key (instance_name / database_name) addresses a *provisioned*
        # instance, a tier that no longer exists; it fails at deploy time with
        # "Database instance <name> does not exist".
        - name: postgres
          postgres:
            branch: projects/${var.lakebase_project}/branches/${var.lakebase_branch}
            database: projects/${var.lakebase_project}/branches/${var.lakebase_branch}/databases/${var.lakebase_database}
            permission: CAN_CONNECT_AND_CREATE

      config:
        # `main.py` starts uvicorn itself, reading DATABRICKS_APP_PORT from the
        # environment. Spelling the port here as `${DATABRICKS_APP_PORT}` would
        # collide with the bundle's own `${...}` interpolation: the resolver
        # looks the name up in the bundle tree and aborts the deployment with
        # `invalid dependency "${DATABRICKS_APP_PORT}", no such node ""`.
        # `bundle validate` does not catch it — only `apps deploy` does.
        command:
          - python
          - main.py
        env:
          # In databricks.yml the field is snake_case (`value_from`); the CLI
          # silently ignores the camelCase `valueFrom` spelling used by
          # app.yaml, which would leave the variable unset at runtime.
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: INV_LLM_ENDPOINT
            value_from: serving-endpoint
          - name: INV_UC_CATALOG
            value: ${var.uc_catalog}
          - name: INV_UC_SCHEMA
            value: ${var.uc_schema}
          - name: INV_UC_VOLUME
            value: ${var.uc_volume}
          - name: INV_GENERIC_WAREHOUSE
            value: "B06VRAC"
          - name: INV_GENERIC_LOCATION
            value: "GENERIQUE"
          - name: INV_LOG_LEVEL
            value: "INFO"
          - name: INV_ENV
            value: ${bundle.target}
          # Attaching the `postgres` resource injects PGHOST/PGDATABASE/PGUSER
          # but NOT the endpoint resource path, and only that path can mint a
          # database credential. The app recovers it by listing this branch's
          # endpoints and matching PGHOST. Built from the same variables as the
          # resource above, so the two cannot drift apart.
          - name: INV_LAKEBASE_BRANCH
            value: projects/${var.lakebase_project}/branches/${var.lakebase_branch}

      lifecycle:
        started: true

  jobs:
    inventory_publish_campaign:
      name: "[inventaire] Publication campagne vers Delta"
      description: >-
        Copie idempotente des données opérationnelles Lakebase d'une campagne
        vers les tables Delta (snapshots immuables, analyses, archivage).
      tasks:
        - task_key: publish
          spark_python_task:
            # Relative to this file's directory (the bundle root). A `../`
            # prefix escapes the sync root and fails validation.
            python_file: ./jobs/publish_campaign_to_delta.py
            parameters:
              - "--catalog"
              - ${var.uc_catalog}
              - "--schema"
              - ${var.uc_schema}
              - "--campaign-code"
              - "{{job.parameters.campaign_code}}"
          environment_key: serverless_env
      parameters:
        - name: campaign_code
          default: ""
      environments:
        - environment_key: serverless_env
          spec:
            client: "3"
            dependencies:
              - psycopg[binary]~=3.2.0
      queue:
        enabled: true

# Targets deliberately declare no `variables:` overrides. Restating a variable
# as `warehouse_id: ${var.warehouse_id}` makes it depend on itself, which the
# CLI rejects at deploy time ("cycle detected in field resolution"). Supply the
# values per environment with `--var=` / `BUNDLE_VAR_*` instead (§4.1 of the
# deployment guide), or hard-code an environment-specific value here.
targets:
  dev:
    default: true
    mode: development
  prod:
    mode: production
    # `mode: production` requires an explicit, single-copy root path; recent
    # CLI versions refuse to deploy without one. This is the same location the
    # CLI would derive by default, spelled out.
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
